<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlos TCG - Lobby Central</title>
    <link rel="stylesheet" href="global.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            background-color: #0f172a; 
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; margin: 0;
            visibility: hidden; /* FOUC FIX */
        }
        
        .lobby-container {
            background: rgba(15, 23, 42, 0.8); border: 2px solid #3b82f6;
            border-radius: 12px; padding: 40px; width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center;
        }
        .lobby-title {
            color: #fbbf24; font-size: 2rem; font-weight: 900;
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;
        }
        .lobby-subtitle {
            color: #94a3b8; margin-bottom: 30px; font-size: 1.1rem;
        }
        .players-setup {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
        }
        .player-box {
            background: #1e293b; padding: 15px; border-radius: 8px;
            border: 1px solid #475569; display: flex; flex-direction: column; gap: 10px;
            box-sizing: border-box;
        }
        .p1-title { color: #60a5fa; font-weight: bold; font-size: 1.2rem; }
        .p2-title { color: #f87171; font-weight: bold; font-size: 1.2rem; }
        
        select, input[type="text"], input[type="password"] {
            padding: 10px; border-radius: 5px; border: 1px solid #475569;
            background: #0f172a; color: white; font-size: 1rem; outline: none;
            width: 100%; box-sizing: border-box; text-align: center; margin: 0;
        }
        select { cursor: pointer; }
        input[type="text"], input[type="password"] { cursor: text; }
        select:focus, input[type="text"]:focus, input[type="password"]:focus { border-color: #fbbf24; }
        /* El autorrelleno del navegador pinta el campo de blanco con su propio fondo, y no hay
           forma de quitarlo con `background`: se tapa con una sombra interior enorme del color
           que toca. Sin esto, en cuanto existe un campo de contraseña en la página el navegador
           cree que hay un formulario de login y deja el chat blanco con tu nombre dentro. */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus,
        textarea:-webkit-autofill, select:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            transition: background-color 9999s ease-in-out 0s;
        }
        /* La contraseña, más baja que un campo normal y alineada a la izquierda: va en una fila
           compartida y con el centrado heredado parecía otra cosa. */
        /* NO es un `type="password"` a propósito: ese tipo es lo que hace que el gestor de
           contraseñas del navegador se despliegue encima, ofrezca guardarla y autorrellene medio
           lobby. Los puntitos los pinta el CSS, que da exactamente el mismo aspecto sin declarar
           "aquí hay una credencial". El `readonly` que se quita al enfocar remata la faena: sin
           él, algunos gestores autorrellenan igual al cargar la página.
           `text-security` la entienden Chrome, Edge, Safari y Firefox desde la 119. */
        #pass-crear { padding: 6px 10px; font-size: 0.85rem; text-align: left;
                      -webkit-text-security: disc; text-security: disc; }
        #pass-crear.visible { -webkit-text-security: none; text-security: none; }
        
        /* BOTONES ORIGINALES INTACTOS */
        .start-btn {
            background: #10b981; color: white; font-size: 1.2rem; font-weight: bold;
            padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); margin-bottom: 15px; width: 100%;
        }
        .start-btn:hover { background: #059669; transform: scale(1.05); }
        
        .btn-create { background: #8b5cf6; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4); }
        .btn-create:hover { background: #7c3aed; }

        .btn-join { background: #f59e0b; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); color: black;}
        .btn-join:hover { background: #d97706; color: white; }

        .back-btn { background: transparent; color: #94a3b8; border: none; margin-top: 30px; cursor: pointer; text-decoration: underline; font-family: inherit; font-size: 1rem;}
        .back-btn:hover { color: white; }
        
        .options-panel {
            background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #475569;
            margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; text-align: left;
        }
        .opt-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .opt-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        /* CHATS Y CAJAS ONLINE (Aprovechan todo el espacio vertical sin romper bordes) */
        .chat-box { 
            flex: 1; min-height: 0; overflow-y: auto; 
            background: #0f172a; border: 1px solid #334155; 
            padding: 10px; border-radius: 5px; margin-bottom: 10px; 
            display: flex; flex-direction: column; gap: 5px;
        }
        .chat-msg { font-size: 0.9rem; color: #cbd5e1; word-wrap: break-word; text-align: left; }
        /* Sin `margin-bottom`: el contenedor ya separa con `gap`, y las dos cosas juntas eran el hueco de más. */
        .room-item { background: #334155; padding: 5px 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-spectate { background: #64748b; padding: 4px 11px; font-size: 0.78rem; border:none; border-radius:4px; color:white; cursor:pointer; transition: 0.2s;}
        .btn-spectate:hover { background: #475569; transform: scale(1.05); }

        /* Expulsar: el hueco se reserva siempre (18px) para que enseñarlo u ocultarlo no mueva
           ni un píxel de la fila; lo que cambia es la visibilidad, no el sitio. */
        /* LOS DOS BOTONES DE LA CABECERA VERDE (candado y copiar enlace). Están centrados en su
           caja, pero al lado de un texto grande el centrado geométrico se ve alto. Este `top` es
           el mando: súbelo o bájalo hasta que te cuadre a ojo. */
        .btn-cabecera-sala { position: relative; top: 2px; }

        .kick-slot { flex: none; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }
        .kick-btn { visibility: hidden; opacity: 0; transition: opacity 120ms ease; background: none; border: none;
                    padding: 0; margin: 0; width: 18px; height: 18px; line-height: 1; font-size: 0.82rem;
                    cursor: pointer; color: #f87171; border-radius: 4px; position: relative; }
        /* Centrado geométrico != centrado ÓPTICO: una línea de texto deja hueco de descendentes
           debajo, así que un botón centrado en la caja se ve por encima de las letras. El empujón
           va solo en las filas de jugador, donde el nombre es de 1rem; en espectadores (0.85rem)
           el desajuste no se aprecia y moverlo lo empeoraría. Si aun así baila, es este número. */
        .fila-kick--jugador .kick-btn { top: 2px; }
        .fila-kick:hover .kick-btn, .kick-btn:focus-visible { visibility: visible; opacity: 1; }
        .kick-btn:hover { background: #7f1d1d; }
        @media (prefers-reduced-motion: reduce) { .kick-btn { transition: none; } }

        .online-col {
            flex: 1; display: flex; flex-direction: column; background: #1e293b; 
            border-radius: 8px; border: 1px solid #475569; padding: 15px;
            box-sizing: border-box; height: 100%;
        }

        /* Contenedor maestro de vistas online (Fija altura a 500px para que no salte) */
        .online-view-container {
            display: flex; gap: 20px; text-align: left; height: 500px;
        }
    </style>
    <script src="guardian.js"></script>
</head>
<body>

    <button class="game-btn" style="position:absolute; top:20px; left:20px; background:#475569;" onclick="mostrarReglas()">Reglas</button>

    <div class="lobby-container" id="lobby-main">
        <div class="lobby-title">Preparación</div>
        <div class="lobby-subtitle" id="mode-subtitle">Cargando...</div>

        <div id="local-view" style="display: none; flex-direction: column;">
            <div class="players-setup">
                <div class="player-box" style="flex: 1; border-top: 4px solid #3b82f6;">
                    <div class="p1-title">Jugador 1</div>
                    <select id="p1-deck-select"><option value="random">🎲 Mazo aleatorio</option></select>
                </div>
                <div class="player-box" style="flex: 1; border-top: 4px solid #ef4444;">
                    <div class="p2-title">Jugador 2</div>
                    <select id="p2-deck-select"><option value="random">🎲 Mazo aleatorio</option></select>
                </div>
            </div>
            <div class="options-panel" id="local-options">
                <label class="opt-row"><input type="checkbox" id="fast-start-check"><span style="color:#cbd5e1; font-size:0.95rem;">Inicio rápido (no aparta cartas, mano inicial instantánea)</span></label>
                <div class="opt-row" style="cursor: default;">
                    <span style="color:#cbd5e1; font-size:0.95rem; flex: 1;">Jugador inicial:</span>
                    <select id="force-start-select" style="flex: 2; padding: 6px;">
                        <option value="random">🎲 Aleatorio (lanzar moneda)</option>
                        <option value="p1">Forzar jugador 1</option>
                        <option value="p2">Forzar jugador 2</option>
                    </select>
                </div>
            </div>
            <div id="local-controls">
                <button class="start-btn" onclick="startLocalMatch()">¡Al campo de batalla!</button>
            </div>
        </div>

        <div id="ai-view" style="display: none; flex-direction: column;">
            <div class="players-setup">
                <div class="player-box" style="flex: 1; border-top: 4px solid #3b82f6;">
                    <div class="p1-title">Tú (Jugador)</div>
                    <select id="ai-p1-deck-select"><option value="random">🎲 Mazo aleatorio</option></select>
                </div>
                <div class="player-box" style="flex: 1; border-top: 4px solid #0ea5e9;">
                    <div class="p2-title" style="color: #0ea5e9;">Contrincante IA</div>
                    <select id="ai-bot-select">
                        <option value="random">🤖 Bot aleatorio (Mazo al azar)</option>
                        </select>
                </div>
            </div>
            <div class="options-panel">
                <label class="opt-row"><input type="checkbox" id="ai-fast-start-check"><span style="color:#cbd5e1; font-size:0.95rem;">Inicio rápido (no aparta cartas, mano inicial instantánea)</span></label>
                <div class="opt-row" style="cursor: default;">
                    <span style="color:#cbd5e1; font-size:0.95rem; flex: 1;">Jugador inicial:</span>
                    <select id="ai-force-start-select" style="flex: 2; padding: 6px;">
                        <option value="random">🎲 Aleatorio (lanzar moneda)</option>
                        <option value="p1">Empiezas tú</option>
                        <option value="p2">Empieza la IA</option>
                    </select>
                </div>
            </div>
            <div id="local-controls">
                <button class="start-btn" style="background: #0ea5e9; box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);" onclick="startAIMatch()">¡Enfrentarse a la Máquina!</button>
            </div>
        </div>

        <div id="online-lobby-view" class="online-view-container" style="display: none;">
            <div class="online-col">
                <h3 style="margin-top: 0; color: #60a5fa;">💬 Chat global</h3>
                <div id="global-chat-box" class="chat-box"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="global-chat-input" autocomplete="off" data-lpignore="true" style="text-align:left;" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') sendGlobalChat()">
                    <button class="start-btn" style="width: auto; padding: 10px 14px; margin: 0; font-size: 1rem;" onclick="sendGlobalChat()">➤</button>
                </div>
            </div>
            <div class="online-col" style="background: transparent; border: none; padding: 0;">
                <!-- Las tres opciones en UNA línea: cada una en dos filas gastaba el sitio que le
                     hace falta a la lista de salas, que a las cuatro ya pedía scroll. El campo de
                     la contraseña no existe hasta que se marca su casilla: es lo que menos se usa
                     y no tiene por qué ocupar sitio el resto del tiempo. -->
                <div style="margin: 12px 0 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px;">
                    <label style="cursor: pointer; color: #fbbf24; font-size: 0.85rem; white-space: nowrap;" title="Permitir que entre gente a mirar la partida">
                        <input type="checkbox" id="allow-spec-check" checked onchange="toggleEspectadores()"> Espectadores
                    </label>
                    <label id="lbl-omni" style="cursor: pointer; color: #fbbf24; font-size: 0.85rem; white-space: nowrap;" title="Quien mire verá también las manos de los dos jugadores">
                        <input type="checkbox" id="omni-check" checked> ...y ven las manos
                    </label>
                    <label style="cursor: pointer; color: #fbbf24; font-size: 0.85rem; white-space: nowrap;" title="Hará falta una contraseña para entrar">
                        <input type="checkbox" id="pass-check" onchange="togglePassCrear()"> Contraseña
                    </label>
                </div>
                <div id="pass-crear-fila" style="display: none; margin: 0 0 10px; gap: 8px; align-items: center; width: 100%;">
                    <input type="text" id="pass-crear" name="sala-clave" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" readonly onfocus="this.removeAttribute('readonly')" maxlength="64" placeholder="Contraseña de la sala" style="margin: 0; flex: 1; min-width: 0;">
                    <label style="cursor: pointer; color: #94a3b8; font-size: 0.8rem; white-space: nowrap;">
                        <input type="checkbox" id="pass-crear-ver" onchange="verPassCrear()"> Mostrar
                    </label>
                </div>
                <div style="display: flex; gap: 10px; flex-direction: column; align-items: center; width: 100%;">
                    <button class="start-btn btn-create" style="margin-bottom: 0;" onclick="createOnlineRoom()">Crear partida</button>
                    <div style="color: #94a3b8; font-weight: bold;">- O -</div>
                    <div style="display: flex; width: 100%; gap: 10px;">
                        <input type="text" id="room-code-input" autocomplete="off" data-lpignore="true" placeholder="CÓDIGO (EJ: A4X9)" maxlength="4" style="text-transform: uppercase;">
                        <button class="start-btn btn-join" style="margin: 0; width: auto; padding: 12px 20px;" onclick="joinRoomByCode(null, false)">Unirse</button>
                        <button class="start-btn" style="background: #64748b; margin: 0; width: auto; padding: 12px 15px;" title="Espectar" onclick="joinRoomByCode(null, true)">👁️</button>
                    </div>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px; color: #fbbf24; border-bottom: 1px solid #475569; padding-bottom: 5px;">Salas activas</h3>
                <div id="rooms-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; border: 1px solid #334155; padding: 10px; border-radius: 5px; background: #0f172a;"></div>
            </div>
        </div>

        <div id="online-room-view" style="display: none; flex-direction: column; gap: 15px; text-align: left; height: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 20px; border-radius: 8px; border: 1px dashed #4ade80; height: 50px; box-sizing: border-box;">
                <div style="display:flex; align-items:center; gap:10px; font-size: 1.2rem; color: #4ade80; font-weight: bold;">SALA: <span id="current-room-code" style="letter-spacing: 2px; font-size: 1.5rem; color: white;">----</span><button id="btn-candado-sala" class="btn-cabecera-sala" title="Contraseña de la sala" onclick="abrirCandado(event)" style="display:none; background:#334155; color:#e2e8f0; border:none; border-radius:6px; padding:4px 10px 0; height:26px; line-height:1; align-items:center; justify-content:center; box-sizing:border-box; font-size:0.9rem; cursor:pointer;">🔓</button><button id="btn-copiar-sala" class="btn-cabecera-sala" title="Copiar el enlace de la sala" onclick="copiarEnlaceSala()" style="background:#166534; color:#dcfce7; border:none; border-radius:6px; padding:4px 10px 0; height:26px; line-height:1; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; font-size:0.78rem; cursor:pointer; white-space:nowrap;">🔗 Copiar enlace</button></div>
                <div id="grace-control" style="display:none; align-items:center; gap:4px;"></div>
                <button class="back-btn" style="margin: 0; padding: 0; color: #f87171;" onclick="leaveRoomView()">Abandonar sala</button>
            </div>
            
            <div style="display: flex; gap: 20px; flex: 1; min-height: 0;">
                <div class="online-col">
                    <h3 style="margin-top: 0; color: #fbbf24;">💬 Chat privado</h3>
                    <div id="room-chat-box" class="chat-box"></div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="room-chat-input" autocomplete="off" data-lpignore="true" style="text-align:left;" placeholder="Escribe..." onkeypress="if(event.key==='Enter') sendRoomChat()">
                        <button class="start-btn" style="width: auto; padding: 10px 14px; margin: 0; font-size: 1rem;" onclick="sendRoomChat()">➤</button>
                    </div>
                </div>
                
                <div class="online-col" id="room-col" style="background: transparent; border: none; padding: 0; gap: 10px; position: relative;">
                    <div class="player-box" style="border-top: 4px solid #3b82f6;">
                        <div class="fila-kick fila-kick--jugador" style="display: flex; justify-content: space-between; align-items: center; gap: 6px;">
                            <span class="p1-title" id="room-p1-name" style="font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;">Esperando...</span><span class="kick-slot" id="room-p1-kick"></span>
                            <span id="room-p1-status" style="color: #94a3b8; font-size: 0.8rem; text-align: right;">⏳ Eligiendo mazo</span>
                        </div>
                    </div>
                    <div class="player-box" style="border-top: 4px solid #ef4444;">
                        <div class="fila-kick fila-kick--jugador" style="display: flex; justify-content: space-between; align-items: center; gap: 6px;">
                            <span class="p2-title" id="room-p2-name" style="font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;">Esperando rival...</span><span class="kick-slot" id="room-p2-kick"></span>
                            <span id="room-p2-status" style="color: #94a3b8; font-size: 0.8rem; text-align: right;">---</span>
                        </div>
                    </div>
                    
                    <div class="player-box" style="border-top: 4px solid #64748b; flex: 1; min-height: 0; overflow: hidden; padding: 10px; display: flex; flex-direction: column;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                            <span style="color: #94a3b8; font-size: 0.9rem; font-weight: bold;">👁️ Espectadores</span>
                            <button id="btn-to-spectators" onclick="becomeSpectator()" style="display:none; background:#64748b; color:#fff; border:none; border-radius:6px; padding:3px 10px; font-size:0.8rem; cursor:pointer;">👁️ Ir a espectadores</button>
                        </div>
                        <!-- Columnas de espectadores: la lista se llena de arriba abajo y, al no caber uno más,
                             salta a la columna de al lado. Con tres llenas se sigue creando columnas hacia la
                             derecha y aparece scroll HORIZONTAL, que es menos molesto que el vertical porque
                             los nombres de la primera columna no se mueven de donde estaban. -->
                        <div id="room-spectators-list" style="font-size: 0.85rem; color: #cbd5e1; flex: 1; min-height: 0; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; overflow-x: auto; overflow-y: hidden;">Ninguno</div>
                    </div>

                    <div id="test-panel-wrap" style="width:100%; position:relative;"></div>

                    <div style="width: 100%;">
                        <div id="rematch-area" style="width:100%; text-align:center; margin-bottom:10px;"></div>
                        <select id="online-deck-select" style="margin-bottom: 10px;"><option value="random">🎲 Mazo aleatorio</option></select>
                        <button class="start-btn" id="btn-ready" style="background: #f59e0b; color: black; margin: 0;" onclick="toggleReady()">¡ESTOY LISTO!</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="back-btn" onclick="location.href='landing.html'">Volver al menú principal</button>
        </div>
    </div>

    <script src="reglas.js"></script>
    <script src="cartas.js"></script>
    <script>
        let userDecks = [];
        let myUsername = 'Invitado_' + Math.floor(Math.random() * 1000);
        let socket = null;
        let currentRoom = null;
        let myRole = null;
        let isReadyLocal = false;
        
        const urlParams = new URLSearchParams(window.location.search);
        // Con `?sala=` el modo se sobreentiende: un enlace a una sala es online por definición, y
        // así el enlace sigue funcionando aunque alguien le quite el `mode` al copiarlo a mano.
        const gameMode = urlParams.get('mode') || (urlParams.get('sala') ? 'online' : 'local');

        async function init() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.loggedIn) myUsername = data.username;

                const decksRes = await fetch('/api/decks');
                const decksData = await decksRes.json();
                if (decksData.success && decksData.decks.length > 0) {
                    userDecks = decksData.decks;
                    let optionsHTML = '<option value="random">🎲 Mazo aleatorio</option>';
                    userDecks.forEach(d => optionsHTML += `<option value="${d.id}">📦 ${d.name}</option>`);
                    document.getElementById('p1-deck-select').innerHTML = optionsHTML;
                    document.getElementById('p2-deck-select').innerHTML = optionsHTML;
                    document.getElementById('online-deck-select').innerHTML = optionsHTML;
                    document.getElementById('ai-p1-deck-select').innerHTML = optionsHTML; // <--- AÑADIDO
                }
            } catch(e) {}

            if (gameMode === 'online') {
                document.getElementById('mode-subtitle').innerText = "Multijugador online";
                document.getElementById('lobby-main').style.width = '850px'; 
                // Si volvemos a una sala terminada, no parpadeamos la vista general: esperamos a entrar en la sala.
                if (!localStorage.getItem('karlos_return_room')) {
                    document.getElementById('online-lobby-view').style.display = 'flex';
                }
                toggleEspectadores();
                initSockets();
                // Enlace directo: se entra en cuanto el socket esté listo. El guardián ya ha
                // decidido antes que no hay partida en curso (si la hubiera, no llegamos aquí sin
                // que él pregunte primero).
                const _sala = salaDeLaURL();
                if (_sala && !localStorage.getItem('karlos_partida_en_curso') && !localStorage.getItem('karlos_return_room')) {
                    socket.on('connect', () => joinRoomByCode(_sala));
                }
            } else if (gameMode === 'ai') { // VISTA DE IA
                document.getElementById('mode-subtitle').innerText = "Jugar contra la IA";
                document.getElementById('ai-view').style.display = 'flex';
            } else {
                document.getElementById('mode-subtitle').innerText = "Modo local";
                document.getElementById('local-view').style.display = 'flex';
            }

            document.body.style.visibility = 'visible'; // Adiós FOUC absoluto
        }

        function initSockets() {
            socket = io();

            // Reingreso a una sala TERMINADA tras pulsar "Volver a la sala" en el cartel.
            socket.on('seatOccupied', (data) => {
                myRole = data.role;
                localStorage.setItem('karlos_online_role', myRole);
                if (data.roomData && data.roomData.status === 'waiting') {
                    document.getElementById('btn-ready').style.display = 'inline-block';
                    document.getElementById('online-deck-select').style.display = 'inline-block';
                }
                updateRoomUI(data.roomData);
            });
            socket.on('becameSpectator', (data) => {
                myRole = 'spectator';
                localStorage.setItem('karlos_online_role', 'spectator');
                document.getElementById('btn-ready').style.display = 'none';
                document.getElementById('online-deck-select').style.display = 'none';
            });
            socket.on('returnedToFinishedRoom', (data) => {
                currentRoom = data.roomCode;
                myRole = data.role;
                localStorage.setItem('karlos_room_code', currentRoom);
                localStorage.setItem('karlos_online_role', myRole);
                document.getElementById('online-lobby-view').style.display = 'none';
                document.getElementById('online-room-view').style.display = 'flex';
                document.getElementById('current-room-code').innerText = currentRoom;
                document.getElementById('btn-ready').style.display = 'none';
                document.getElementById('online-deck-select').style.display = 'none';
                updateRoomUI(data.roomData);
            });
            socket.on('finishedRoomClosed', (data) => {
                if (window._lastClosedAt && Date.now() - window._lastClosedAt < 3000) return;
                window._lastClosedAt = Date.now();
                alert((data && data.msg) ? data.msg : 'La sala se ha cerrado.');
                currentRoom = null; myRole = null;
                localStorage.removeItem('karlos_room_code');
                localStorage.removeItem('karlos_online_role');
                localStorage.removeItem('karlos_return_room');
                document.getElementById('online-room-view').style.display = 'none';
                document.getElementById('online-lobby-view').style.display = 'flex';
            });
            const _returnRoom = localStorage.getItem('karlos_return_room');
            if (_returnRoom) {
                localStorage.removeItem('karlos_return_room');
                socket.emit('returnToFinishedRoom', { roomCode: _returnRoom, username: myUsername });
            }

            socket.on('roomListUpdate', (rooms) => {
                const list = document.getElementById('rooms-list');
                list.innerHTML = '';
                if (rooms.length === 0) {
                    list.innerHTML = '<div style="color:#64748b; padding: 10px; text-align: center; margin-top: 20px;">No hay salas activas.<br>¡Crea la tuya!</div>';
                    return;
                }
                
                const isAdmin = localStorage.getItem('karlos_is_admin') === '1';

                rooms.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'room-item';
                    
                    // Si es admin, generamos el botón rojo. Si no, lo dejamos vacío.
                    const adminBtn = isAdmin ? `<button class="btn-spectate" style="background:#ef4444;" title="Forzar Cierre" onclick="adminCloseRoom('${r.code}')">🗑️</button>` : '';

                    div.innerHTML = `
                        <span style="color: white; font-weight:bold; font-size:0.9rem;">${r.conPassword ? '<span title="Necesita contraseña" style="margin-right:4px;">🔒</span>' : ''}${r.host} <span style="color:#fbbf24; font-size:0.8rem; font-weight:normal;" title="Gente dentro ahora mismo">(${r.presentes !== undefined ? r.presentes : r.playersCount}/2)</span>${r.reservados ? `<span style="color:#94a3b8; font-size:0.75rem; font-weight:normal;" title="Asiento guardado para alguien que acaba de salir; se libera solo"> · ${r.reservados} reservado${r.reservados > 1 ? 's' : ''}</span>` : ''}${r.agotados ? `<span style="color:#64748b; font-size:0.75rem; font-weight:normal;" title="Su ocupante no volvió a tiempo"> · ${r.agotados} agotado${r.agotados > 1 ? 's' : ''}</span>` : ''}</span>
                        <div style="display:flex; gap:5px;">
                            ${r.status === 'waiting' && r.playersCount < 2 ? `<button class="btn-spectate" style="background:#10b981;" onclick="joinRoomByCode('${r.code}', false)">Unirse</button>` : ''}
                            <button class="btn-spectate" title="Espectar" onclick="joinRoomByCode('${r.code}', true)">👁️</button>
                            ${adminBtn} </div>
                    `;
                    list.appendChild(div);
                });
            });

            socket.on('globalChat', (data) => {
                const box = document.getElementById('global-chat-box');
                const color = data.username === myUsername ? '#fbbf24' : '#60a5fa';
                box.innerHTML += `<div class="chat-msg"><strong style="color:${color};">${data.username}:</strong> ${data.msg}</div>`;
                box.scrollTop = box.scrollHeight;
            });

            socket.on('roomChatHistory', (arr) => {
                const box = document.getElementById('room-chat-box');
                if (!box) return;
                box.innerHTML = '';
                (arr || []).forEach(data => {
                    const color = data.username === 'Sistema' ? '#94a3b8' : (data.username === myUsername ? '#fbbf24' : '#60a5fa');
                    box.innerHTML += `<div class="chat-msg"><strong style="color:${color};">${data.username}:</strong> ${data.msg}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });

            socket.on('roomChat', (data) => {
                const box = document.getElementById('room-chat-box');
                const color = data.username === 'Sistema' ? '#94a3b8' : (data.username === myUsername ? '#fbbf24' : '#60a5fa');
                box.innerHTML += `<div class="chat-msg"><strong style="color:${color};">${data.username}:</strong> ${data.msg}</div>`;
                box.scrollTop = box.scrollHeight;
            });

            socket.on('roomJoined', (data) => {
                currentRoom = data.roomCode;
                myRole = data.role;
                
                // Guardamos si la sala permite verlo todo
                if (data.roomData && data.roomData.omniscient !== undefined) {
                    localStorage.setItem('karlos_omniscient', data.roomData.omniscient);
                }

                // Si entras como espectador en una partida iniciada O ya terminada, vamos directo al tablero/cartel
                if (myRole === 'spectator' && data.roomData && (data.roomData.status === 'playing' || data.roomData.status === 'finished')) {
                    localStorage.setItem('karlos_room_code', currentRoom);
                    localStorage.setItem('karlos_online_role', 'spectator');
                    localStorage.setItem('karlos_game_mode', 'online');
                    localStorage.setItem('karlos_partida_en_curso', currentRoom);
                    if (data.roomData.players) {
                        if (data.roomData.players.p1) localStorage.setItem('karlos_p1_name', data.roomData.players.p1.name);
                        if (data.roomData.players.p2) localStorage.setItem('karlos_p2_name', data.roomData.players.p2.name);
                    }
                    window.location.href = 'index.html';
                    return;
                }
                
                document.getElementById('online-lobby-view').style.display = 'none';
                document.getElementById('online-room-view').style.display = 'flex';
                document.getElementById('current-room-code').innerText = data.roomCode;
                
                if (myRole === 'spectator') {
                    document.getElementById('btn-ready').style.display = 'none';
                    document.getElementById('online-deck-select').style.display = 'none';
                }
                updateRoomUI(data.roomData);
                // Solo un admin publica su config de pruebas guardada, y solo si la sala está por defecto (no pisa la de otro admin).
                const _saved = loadTestCfg();
                const _hayGuardado = isTestNonDefault(_saved) || !!(_saved.escenario || '').trim();
                const _salaTocada = isTestNonDefault(data.roomData.testConfig) || !!((data.roomData.testConfig || {}).escenario || '').trim();
                if (localStorage.getItem('karlos_is_admin') === '1' && _hayGuardado && !_salaTocada) {
                    testCfg = _saved; pushTestCfg();
                }
            });

            socket.on('roomUpdate', (roomData) => updateRoomUI(roomData));

            socket.on('gameStart', (data) => {
                localStorage.setItem('karlos_game_mode', 'online');
                localStorage.setItem('karlos_online_role', myRole);
                localStorage.setItem('karlos_room_code', currentRoom);
                
                // Guardamos la configuración visual
                if (data.omniscient !== undefined) {
                    localStorage.setItem('karlos_omniscient', data.omniscient);
                }
                
                localStorage.setItem('karlos_p1_deck', typeof data.p1Deck === 'string' ? data.p1Deck : JSON.stringify(data.p1Deck));
                localStorage.setItem('karlos_p2_deck', typeof data.p2Deck === 'string' ? data.p2Deck : JSON.stringify(data.p2Deck));
                localStorage.setItem('karlos_username', myUsername);
                localStorage.setItem('karlos_test_active', JSON.stringify(data.testConfig || { fastStart: false, startingPlayer: 'random', forcedHands: { p1: [], p2: [] } }));
                
                // Guardar los nombres de ambos jugadores
                localStorage.setItem('karlos_p1_name', data.p1Name);
                localStorage.setItem('karlos_p2_name', data.p2Name);
                
                window.location.href = 'index.html';
            });

            // Sala con contraseña: el servidor no ha mandado NADA de ella, solo que hace falta.
            socket.on('roomLocked', (data) => {
                const p = prompt(data && data.fallo
                    ? '🔒 Contraseña incorrecta. Prueba otra vez:'
                    : '🔒 Esta sala tiene contraseña:');
                if (p === null) {                    // se arrepintió
                    if (salaDeLaURL()) location.replace(location.pathname + '?mode=online');
                    return;
                }
                const t = _ultimoIntento || { code: (data && data.code) || '', asSpectator: false };
                joinRoomByCode(t.code, t.asSpectator, p);
            });

            socket.on('roomError', (msg) => {
                alert("⚠️ " + msg);
                // Si veníamos por enlace directo hay que QUITAR el parámetro antes de recargar:
                // con él puesto, recargar volvería a intentar entrar, fallar y recargar otra vez.
                if (salaDeLaURL()) location.replace(location.pathname + '?mode=online');
                else location.reload();
            });
        }

        // ===== PANEL DE PRUEBAS (ADMIN) =====
        const DEFAULT_TEST_CONFIG = { fastStart: false, startingPlayer: 'random', forcedHands: { p1: [], p2: [] }, escenario: '' };
        let testCfg = loadTestCfg();
        let _tpLastRoom = null;
        let _tickReserva = null;

        function loadTestCfg() {
            try {
                const c = JSON.parse(localStorage.getItem('karlos_test_config'));
                if (c && typeof c === 'object') {
                    return {
                        fastStart: !!c.fastStart,
                        startingPlayer: (c.startingPlayer === 'p1' || c.startingPlayer === 'p2') ? c.startingPlayer : 'random',
                        forcedHands: {
                            p1: Array.isArray(c.forcedHands && c.forcedHands.p1) ? c.forcedHands.p1.slice(0, 6) : [],
                            p2: Array.isArray(c.forcedHands && c.forcedHands.p2) ? c.forcedHands.p2.slice(0, 6) : []
                        },
                        escenario: typeof c.escenario === 'string' ? c.escenario : ''
                    };
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(DEFAULT_TEST_CONFIG));
        }
        function saveTestCfg() { localStorage.setItem('karlos_test_config', JSON.stringify(testCfg)); }
        function isTestNonDefault(c) {
            return !!(c && (c.fastStart || (c.startingPlayer && c.startingPlayer !== 'random') ||
                (c.forcedHands && ((c.forcedHands.p1 && c.forcedHands.p1.length) || (c.forcedHands.p2 && c.forcedHands.p2.length)))));
        }
        function pushTestCfg() {
            saveTestCfg();
            if (_tpLastRoom) _tpLastRoom.testConfig = JSON.parse(JSON.stringify(testCfg)); // optimista: ya queda reflejado en la sala local
            if (currentRoom) socket.emit('setTestConfig', { roomCode: currentRoom, config: testCfg });
        }
        // Estado del escenario pegado: '' (no hay), 'ok' o 'malo' con su motivo. El criterio es
        // `validarEscenario` de cartas.js, el MISMO que usa la partida al montarlo: la lucecita
        // verde de aquí y que la mesa arranque tienen que ser la misma pregunta.
        function estadoEscenario(txt) {
            const t = (txt || '').trim();
            if (!t) return { luz: '', motivo: '' };
            let spec;
            try { spec = JSON.parse(t); }
            catch (e) { return { luz: 'malo', motivo: 'no es JSON válido: ' + e.message }; }
            const r = (typeof validarEscenario === 'function') ? validarEscenario(spec) : { ok: true };
            return r.ok ? { luz: 'ok', motivo: '' } : { luz: 'malo', motivo: r.motivo };
        }
        function hayEscenarioValido(cfg) { return estadoEscenario(cfg && cfg.escenario).luz === 'ok'; }
        function tpCardName(id) { const c = CARD_DB.find(x => x.id == id); return c ? c.name : ('#' + id); }

        function renderTestPanel(room) {
            const wrap = document.getElementById('test-panel-wrap');
            if (!wrap) return;
            // El config vivo es el de la sala: así, si hay varios admins, todos lo ven sincronizado en tiempo real.
            // El config vivo manda, pero conservando el escenario guardado si la sala aún no trae
            // ninguno: al crear sala nueva llega vacía y, sin esto, se perdía lo último pegado.
            if (room && room.testConfig) {
                const _esc = testCfg.escenario || '';
                testCfg = JSON.parse(JSON.stringify(room.testConfig));
                if (!(testCfg.escenario || '').trim() && _esc.trim()) testCfg.escenario = _esc;
            }
            // El panel EDITABLE es exclusivo de admins (mismo criterio que el botón de debug en partida).
            const isAdmin = localStorage.getItem('karlos_is_admin') === '1';
            const inGame = room && room.status && room.status !== 'waiting';
            if (isAdmin && !inGame) { wrap.innerHTML = renderAdminPanel(); wireAdminPanel(); return; }
            const cfg = (room && room.testConfig) ? room.testConfig : null;
            // Un escenario forzado se anuncia SIN detalles: la lista de cartas de cada zona no
            // cabe en ese recuadro, y saberla tampoco le sirve de nada a quien no puede tocarla.
            if (hayEscenarioValido(cfg)) { wrap.innerHTML = renderReadonlyEscenario(); return; }
            wrap.innerHTML = isTestNonDefault(cfg) ? renderReadonlySummary(cfg) : '';
        }
        function summaryLines(cfg) {
            const lines = [];
            if (cfg.fastStart) lines.push('Inicio rápido');
            if (cfg.startingPlayer === 'p1') lines.push('Empieza J1');
            else if (cfg.startingPlayer === 'p2') lines.push('Empieza J2');
            if (cfg.forcedHands && cfg.forcedHands.p1 && cfg.forcedHands.p1.length) lines.push('Mano J1: ' + cfg.forcedHands.p1.map(tpCardName).join(', '));
            if (cfg.forcedHands && cfg.forcedHands.p2 && cfg.forcedHands.p2.length) lines.push('Mano J2: ' + cfg.forcedHands.p2.map(tpCardName).join(', '));
            return lines;
        }
        function renderReadonlyEscenario() {
            return `<div style="background:#1f2937; border:1px solid #f59e0b; border-radius:8px; padding:8px 12px; font-size:0.78rem; color:#fcd34d;">📋 <b>El anfitrión forzó un escenario</b></div>`;
        }
        function renderReadonlySummary(cfg) {
            return `<div style="background:#1f2937; border:1px solid #f59e0b; border-radius:8px; padding:8px 12px; font-size:0.78rem; color:#fcd34d;">⚙️ <b>El anfitrión activó opciones de prueba:</b><br>${summaryLines(cfg).map(l => '• ' + l).join('<br>')}</div>`;
        }
        // Dos columnas: las opciones de siempre y el escenario forzado, que las pisa. Se ven a la
        // vez a propósito, porque la relación entre las dos (una anula a la otra) es justo lo que
        // hay que poder leer de un vistazo: verde aquí = rojo allí.
        // Las dos cabeceras viven SIEMPRE en su sitio, una al lado de la otra. Al abrir una, se
        // pinta encima un panel flotante que arranca justo donde está esa cabecera, se estira a
        // lo ancho y luego crece HACIA ARRIBA hasta el borde superior de la columna, tapando lo
        // que haya debajo. Así el despliegue no empuja nada y la columna no necesita scroll (que
        // era lo que sacaba las dos barras al pasar el ratón por ¡ESTOY LISTO!).
        function panelAbierto() {
            if (localStorage.getItem('karlos_test_panel_open') === '1') return 'opc';
            if (localStorage.getItem('karlos_scen_panel_open') === '1') return 'esc';
            return null;
        }
        function renderAdminPanel() {
            const cuerpo = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start;">`
                + `<div style="min-width:0;">${renderCabecera('opc')}</div>`
                + `<div style="min-width:0;">${renderCabecera('esc')}</div></div>`;
            const cual = panelAbierto();
            if (!cual) return cuerpo;
            // El flotante repite la cabecera dentro (misma que la de abajo, para que el paso de una
            // a otra no se note) y debajo su cuerpo.
            return cuerpo + `<div id="tp-ovl" style="position:absolute; z-index:40; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; border-radius:8px; background:#0f172a; border:1px solid #475569; box-shadow:0 -6px 24px rgba(0,0,0,.55);">`
                + `<div style="flex:none;">${renderCabecera(cual, true)}</div>`
                + `<div id="tp-ovl-body" style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;">${cual === 'opc' ? cuerpoOpciones() : cuerpoEscenario()}</div>`
                + `</div>`;
        }
        // Coloca y anima el flotante. Arranca clavado sobre su cabecera y termina ocupando desde
        // el borde superior de la columna hasta el borde inferior de la zona de paneles.
        function colocarFlotante(cual, cerrando, alTerminar, alInstante) {
            const ovl = document.getElementById('tp-ovl');
            const wrap = document.getElementById('test-panel-wrap');
            const col = document.getElementById('room-col');
            const cab = document.getElementById(cual === 'opc' ? 'tp-head' : 'sc-head');
            if (!ovl || !wrap || !col || !cab) return;
            const rW = wrap.getBoundingClientRect(), rC = col.getBoundingClientRect(), rH = cab.getBoundingClientRect();
            const desde = { left: Math.round(rH.left - rW.left), width: Math.round(rH.width), height: Math.round(rH.height) };
            const hasta = { left: 0, width: Math.round(rW.width), height: Math.round(rW.bottom - rC.top) };
            const a = cerrando ? hasta : desde, b = cerrando ? desde : hasta;
            const suave = !alInstante && (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            const poner = (e) => { ovl.style.left = e.left + 'px'; ovl.style.width = e.width + 'px'; ovl.style.height = e.height + 'px'; };
            ovl.style.bottom = '0px';
            ovl.style.transition = 'none';
            poner(a);
            if (!suave) { poner(b); if (alTerminar) alTerminar(); return; }
            // Primero a lo ancho y luego a lo alto: la altura espera a que el ancho vaya por la
            // mitad, que es lo que hace que se lea como "se estira y entonces sube".
            void ovl.offsetWidth;
            ovl.style.transition = 'left 170ms cubic-bezier(.22,.61,.36,1), width 170ms cubic-bezier(.22,.61,.36,1), height 220ms cubic-bezier(.22,.61,.36,1) 90ms';
            requestAnimationFrame(() => {
                poner(b);
                if (alTerminar) setTimeout(alTerminar, 330);
            });
        }
        // Las cabeceras y los cuerpos, separados: la cabecera se pinta DOS veces (en su sitio de
        // siempre y dentro del flotante) y el cuerpo solo dentro del flotante.
        function renderCabecera(cual, enFlotante) {
            const open = panelAbierto() === cual;
            const flecha = `<span style="color:#94a3b8; font-size:0.9rem;">${open ? '▾' : '▸'}</span>`;
            if (cual === 'opc') {
                const nd = isTestNonDefault(testCfg);
                const pisado = hayEscenarioValido(testCfg);
                // Roja cuando hay un escenario válido al lado: lo que haya configurado aquí NO se
                // va a aplicar, y eso tiene que verse sin desplegar nada.
                const luz = pisado ? ' <span style="color:#f87171;" title="Un escenario forzado anula estas opciones">●</span>'
                         : (nd ? ' <span style="color:#4ade80;">●</span>' : '');
                return `<div id="${enFlotante ? 'tp-head-ovl' : 'tp-head'}" data-cab="opc" style="display:flex; align-items:center; justify-content:space-between; gap:8px; height:34px; box-sizing:border-box; cursor:pointer; background:#0f172a; border:1px solid #475569; border-radius:8px; padding:6px 12px;"><span style="font-size:0.78rem; color:#fbbf24; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">⚙️ Opciones de prueba${luz}</span><span style="color:#94a3b8; font-size:0.9rem;">${open ? '▾' : '▸'}</span></div>`;
            }
            const est = estadoEscenario(testCfg.escenario);
            const luz = est.luz === 'ok' ? ' <span style="color:#4ade80;">●</span>'
                      : est.luz === 'malo' ? ` <span style="color:#f87171;" title="${(est.motivo || '').replace(/"/g, '&quot;')}">●</span>` : '';
            // El botón de Pegar vive en la CABECERA, no dentro: el caso normal es pegar y jugar,
            // sin desplegar nada. Por eso para el clic (si no, abriría y cerraría el panel).
            return `<div id="${enFlotante ? 'sc-head-ovl' : 'sc-head'}" data-cab="esc" style="display:flex; align-items:center; justify-content:space-between; gap:8px; height:34px; box-sizing:border-box; cursor:pointer; background:#0f172a; border:1px solid #475569; border-radius:8px; padding:6px 12px;">`
                + `<span style="font-size:0.78rem; color:#c084fc; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📋 Escenario${luz}</span>`
                + `<span style="display:flex; align-items:center; gap:8px;">`
                + `<button id="${enFlotante ? 'sc-paste-ovl' : 'sc-paste'}" data-pegar="1" title="Pegar el escenario del portapapeles" style="background:#7c3aed; color:#fff; border:none; border-radius:6px; padding:0 10px; height:22px; line-height:1; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; font-size:0.8rem; cursor:pointer; white-space:nowrap;">Pegar</button>`
                + `<span style="color:#94a3b8; font-size:0.9rem;">${open ? '▾' : '▸'}</span></span></div>`;;
        }
        function cuerpoOpciones() {
            const seatBlock = (seat) => {
                const list = testCfg.forcedHands[seat] || [];
                const chips = list.map((id, i) => `<span style="display:inline-flex; align-items:center; gap:4px; background:#334155; border-radius:12px; padding:2px 8px; margin:2px; font-size:0.72rem; color:#e2e8f0;">${tpCardName(id)} <span data-rm="${seat}:${i}" style="cursor:pointer; color:#f87171;">✕</span></span>`).join('');
                return `<div style="margin-top:6px;"><div style="font-size:0.72rem; color:#94a3b8; margin-bottom:2px;">Mano forzada ${seat === 'p1' ? 'J1' : 'J2'} (máx. 6):</div><div>${chips || '<span style="color:#64748b; font-size:0.72rem;">- ninguna -</span>'}</div><button data-add="${seat}" style="margin-top:4px; background:#1e293b; color:#cbd5e1; border:1px dashed #475569; border-radius:6px; padding:3px 8px; font-size:0.72rem; cursor:pointer;">＋ Añadir carta</button><div id="tp-picker-${seat}" style="display:none; margin-top:4px;"></div></div>`;
            };
            return `<div style="background:#0f172a; padding:10px 12px; flex:1; min-height:0; box-sizing:border-box;"><label style="display:flex; align-items:center; gap:8px; font-size:0.8rem; color:#e2e8f0; cursor:pointer;"><input type="checkbox" id="tp-fast" ${testCfg.fastStart ? 'checked' : ''}> Inicio rápido (saltar apartar 3 cartas)</label><div style="margin-top:8px; font-size:0.8rem; color:#e2e8f0;">Empieza: <select id="tp-start" style="margin-left:6px; width:auto; display:inline-block; padding:3px 8px; font-size:0.8rem; height:auto; margin-bottom:0; border-radius:6px;"><option value="random" ${testCfg.startingPlayer === 'random' ? 'selected' : ''}>🎲 Aleatorio</option><option value="p1" ${testCfg.startingPlayer === 'p1' ? 'selected' : ''}>J1</option><option value="p2" ${testCfg.startingPlayer === 'p2' ? 'selected' : ''}>J2</option></select></div>${seatBlock('p1')}${seatBlock('p2')}<button id="tp-reset" style="margin-top:10px; background:#7f1d1d; color:#fecaca; border:none; border-radius:6px; padding:4px 10px; font-size:0.72rem; cursor:pointer;">Restablecer a por defecto</button></div>`;
        }
        let _scenAcabaDeAbrirse = false;
        function cuerpoEscenario() {
            const est = estadoEscenario(testCfg.escenario);
            const aviso = est.luz === 'malo'
                ? `<div id="sc-error" style="margin-top:7px; color:#fca5a5; font-size:0.72rem; line-height:1.35;">⚠️ ${est.motivo}</div>`
                : (est.luz === 'ok' ? `<div style="margin-top:7px; color:#86efac; font-size:0.72rem;">✔️ Escenario válido. Anula las opciones de prueba.</div>` : '');
            const body = `<div style="background:#0f172a; padding:10px 12px; flex:1; min-height:0; box-sizing:border-box; display:flex; flex-direction:column;">`
                + `<textarea id="sc-text" spellcheck="false" placeholder='{"turno":2,"turnoDe":"p1","empieza":"p2","p1":{...},"p2":{...}}' style="width:100%; box-sizing:border-box; flex:1; min-height:90px; resize:vertical; background:#020617; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:6px 8px; font-family:monospace; font-size:0.72rem; line-height:1.4;">${(testCfg.escenario || '').replace(/</g, '&lt;')}</textarea>`
                + aviso.replace('margin-top:7px', 'margin-top:7px; flex:none')
                + `<button id="sc-clear" style="margin-top:8px; background:#7f1d1d; color:#fecaca; border:none; border-radius:6px; padding:4px 10px; font-size:0.72rem; cursor:pointer;">Quitar escenario</button>`
                + `</div>`;
            return body;
        }
        // Un aviso diminuto y efímero pegado al botón: lo justo para saber que el clic hizo algo.
        // Nada de notificaciones del navegador, que para esto son un cañonazo.
        //
        // OJO CON EL SITIO (Toto, 2-sep-2026): esto vive colgado de la COLUMNA, no del panel.
        // `pushTestCfg` emite al servidor, el servidor contesta con un `roomUpdate` a los pocos
        // milisegundos y ese repintado recrea el panel entero: metido dentro, el aviso duraba lo
        // que tardaba en llegar la respuesta, o sea el parpadeo que se veía.
        let _pegarEstado = null;   // { icono, fin }
        let _pegarT1 = null, _pegarT2 = null;
        function avisillo(texto, ancla) {
            const btn = ancla || document.querySelector('#test-panel-wrap [data-pegar]');
            // Se cuelga del contenedor posicionado más cercano que NO se repinte; si no hay
            // ninguno, del body, que siempre está.
            const col = (btn && btn.closest && btn.closest('#room-col')) || document.body;
            if (!col || !btn || !texto) return;
            const viejo = document.getElementById('sc-avisillo');
            if (viejo) viejo.remove();
            const rC = (col === document.body)
                ? { left: -window.scrollX, top: -window.scrollY }
                : col.getBoundingClientRect();
            const rB = btn.getBoundingClientRect();
            const d = document.createElement('div');
            d.id = 'sc-avisillo';
            d.textContent = texto;
            d.style.cssText = 'position:absolute; z-index:60; pointer-events:none; background:#1e293b;'
                + ' border:1px solid #475569; color:#e2e8f0; font-size:0.72rem; padding:3px 9px;'
                + ' border-radius:6px; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.5);'
                + ' opacity:0; transform:translateY(4px); transition:opacity 150ms ease, transform 150ms ease;';
            d.style.left = Math.round(rB.left - rC.left) + 'px';
            d.style.top = Math.round(rB.bottom - rC.top + 6) + 'px';
            col.appendChild(d);
            requestAnimationFrame(() => { d.style.opacity = '1'; d.style.transform = 'translateY(0)'; });
            setTimeout(() => { d.style.opacity = '0'; d.style.transform = 'translateY(4px)'; setTimeout(() => d.remove(), 220); }, 1300);
        }
        // El botón enseña el resultado sin cambiar de tamaño. El estado vive FUERA del DOM y se
        // vuelve a pintar en cada repintado (ver wireAdminPanel), que si no se lo come el
        // `roomUpdate` que llega justo después de guardar.
        function pintarPegar() {
            document.querySelectorAll('#test-panel-wrap [data-pegar]').forEach(b => {
                if (!b.style.minWidth) b.style.minWidth = Math.round(b.getBoundingClientRect().width) + 'px';
                b.style.transition = 'opacity 200ms ease';
                if (!_pegarEstado) { b.textContent = 'Pegar'; b.style.opacity = '1'; return; }
                b.textContent = _pegarEstado.icono;
                b.style.opacity = _pegarEstado.fundiendo ? '0' : '1';
            });
        }
        function feedbackPegar(icono, texto) {
            clearTimeout(_pegarT1); clearTimeout(_pegarT2);
            _pegarEstado = { icono, fundiendo: false };
            pintarPegar();
            avisillo(texto);
            _pegarT1 = setTimeout(() => { if (_pegarEstado) { _pegarEstado.fundiendo = true; pintarPegar(); } }, 550);
            _pegarT2 = setTimeout(() => { _pegarEstado = null; pintarPegar(); }, 760);
        }

        function ponEscenario(txt, avisar) {
            const est = estadoEscenario(txt);
            if (est.luz === 'malo') { if (avisar) alert('⚠️ Ese escenario no vale: ' + est.motivo); return false; }
            testCfg.escenario = (txt || '').trim();
            pushTestCfg(); renderTestPanel(_tpLastRoom);
            return true;
        }
        async function pegarEscenario() {
            let txt = null;
            // El portapapeles solo se puede LEER en contexto seguro (HTTPS o localhost), y esto se
            // sirve por HTTP en la red de casa, así que casi siempre caemos en el plan B: abrir el
            // cuadro y que lo pegue él con Ctrl+V. Se dice, en vez de fallar en silencio.
            try { if (navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText(); }
            catch (e) { txt = null; }
            // Tres finales distintos, y antes se confundían dos: si el portapapeles trae algo que
            // NO es texto (una imagen), readText devuelve cadena vacía, no un error. Eso caía en
            // la rama de "no puedo leer el portapapeles" y acababa desplegando el panel sin decir
            // nada, o sea, pareciendo que el botón no hacía nada (Toto, 2-sep-2026).
            if (txt === null) {
                // Ni siquiera se puede leer (sin HTTPS el navegador no deja): se abre el cuadro
                // para que lo pegue a mano, que es la única salida.
                if (panelAbierto() !== 'esc') alternarPanel('esc');
                const ta = document.getElementById('sc-text');
                if (ta) { ta.focus(); ta.select(); }
                alert('Tu navegador no deja leer el portapapeles sin HTTPS.\nTe he abierto el cuadro: pega ahí con Ctrl+V.');
                return;
            }
            if (!String(txt).trim()) {
                feedbackPegar('🚫', 'El portapapeles no tiene texto');
                return;
            }
            // Pegado con éxito: no se abre el panel, que el caso normal es pegar y jugar. La
            // lucecita de la cabecera ya dice si vale. El botón contesta al clic él solo.
            const mismo = String(txt).trim() === (testCfg.escenario || '').trim();
            if (ponEscenario(txt, true)) feedbackPegar(mismo ? '🔁' : '✔️', mismo ? 'Mismo escenario' : 'Correcto');
            else feedbackPegar('🚫', 'No vale como escenario');
        }
        function wireEscenarioPanel() {
            const ta = document.getElementById('sc-text');
            if (ta) {
                // Se guarda al salir del cuadro, no en cada tecla: si no, cada letra emitiría al
                // servidor y el panel se repintaría debajo del cursor.
                ta.onblur = () => { if ((ta.value || '').trim() !== (testCfg.escenario || '')) { testCfg.escenario = (ta.value || '').trim(); pushTestCfg(); renderTestPanel(_tpLastRoom); } };
                if (_scenAcabaDeAbrirse && (ta.value || '').trim()) { ta.focus(); ta.select(); }
                _scenAcabaDeAbrirse = false;
            }
            const clear = document.getElementById('sc-clear');
            if (clear) clear.onclick = () => { testCfg.escenario = ''; pushTestCfg(); renderTestPanel(_tpLastRoom); };
        }

        let _ovlAnimando = false;
        // Abrir/cerrar con su animación. Las cabeceras de abajo y la del flotante hacen lo mismo,
        // por eso se cablean por `data-cab` y no por id: hay dos de cada cuando está abierto.
        function alternarPanel(cual) {
            if (_ovlAnimando) return;
            if (panelAbierto() === cual) {
                _ovlAnimando = true;
                colocarFlotante(cual, true, () => {
                    localStorage.setItem('karlos_test_panel_open', '0');
                    localStorage.setItem('karlos_scen_panel_open', '0');
                    _ovlAnimando = false;
                    renderTestPanel(_tpLastRoom);
                });
                return;
            }
            localStorage.setItem('karlos_test_panel_open', cual === 'opc' ? '1' : '0');
            localStorage.setItem('karlos_scen_panel_open', cual === 'esc' ? '1' : '0');
            _scenAcabaDeAbrirse = (cual === 'esc');
            _ovlAnimando = true;
            renderTestPanel(_tpLastRoom);
            colocarFlotante(cual, false, () => { _ovlAnimando = false; });
        }
        function wireAdminPanel() {
            document.querySelectorAll('#test-panel-wrap [data-cab]').forEach(el => {
                el.onclick = () => alternarPanel(el.getAttribute('data-cab'));
            });
            document.querySelectorAll('#test-panel-wrap [data-pegar]').forEach(el => {
                el.onclick = (ev) => { ev.stopPropagation(); pegarEscenario(); };
            });
            // Un repintado con el panel ya abierto (marcar una casilla, añadir una carta) recrea el
            // flotante: se recoloca al instante y SIN animación, que si no parpadearía en cada clic.
            pintarPegar();   // el aviso del botón sobrevive a los repintados
            const _cual = panelAbierto();
            if (_cual && !_ovlAnimando && document.getElementById('tp-ovl')) colocarFlotante(_cual, false, null, true);
            const fast = document.getElementById('tp-fast');
            if (fast) fast.onchange = () => { testCfg.fastStart = fast.checked; pushTestCfg(); renderTestPanel(_tpLastRoom); };
            const start = document.getElementById('tp-start');
            if (start) start.onchange = () => { testCfg.startingPlayer = start.value; pushTestCfg(); renderTestPanel(_tpLastRoom); };
            document.querySelectorAll('#test-panel-wrap [data-rm]').forEach(el => el.onclick = () => {
                const parts = el.getAttribute('data-rm').split(':');
                testCfg.forcedHands[parts[0]].splice(parseInt(parts[1]), 1); pushTestCfg(); renderTestPanel(_tpLastRoom);
            });
            document.querySelectorAll('#test-panel-wrap [data-add]').forEach(el => el.onclick = () => openCardPicker(el.getAttribute('data-add')));
            const reset = document.getElementById('tp-reset');
            // Restablece SOLO esta columna: el escenario forzado tiene su propio botón de quitar.
            if (reset) reset.onclick = () => { const _esc = testCfg.escenario || ''; testCfg = JSON.parse(JSON.stringify(DEFAULT_TEST_CONFIG)); testCfg.escenario = _esc; pushTestCfg(); renderTestPanel(_tpLastRoom); };
            wireEscenarioPanel();
        }

        function openCardPicker(seat) {
            const box = document.getElementById('tp-picker-' + seat);
            if (!box) return;
            if (testCfg.forcedHands[seat].length >= 6) { alert('Máximo 6 cartas forzadas por jugador.'); return; }
            box.style.display = 'block';
            box.innerHTML = `<input type="text" id="tp-search-${seat}" placeholder="🔍 Buscar carta..." style="width:100%; box-sizing:border-box; font-size:0.75rem; padding:4px;"><div id="tp-results-${seat}" style="max-height:120px; overflow-y:auto; margin-top:3px;"></div>`;
            const input = document.getElementById('tp-search-' + seat);
            const results = document.getElementById('tp-results-' + seat);
            const renderResults = () => {
                const q = (input.value || '').toLowerCase();
                // El panel de debug las enseña TODAS a propósito (tokens y cartas de prueba incluidas):
                // es la puerta por la que se meten en una mesa de pruebas.
                const matches = CARD_DB.filter(c => c.name && c.name.toLowerCase().includes(q)).slice(0, 12);
                results.innerHTML = matches.map(c => `<button data-pick="${c.id}" style="display:block; width:100%; text-align:left; background:#1e293b; color:#e2e8f0; border:none; border-bottom:1px solid #334155; padding:4px 6px; font-size:0.74rem; cursor:pointer;">${c.name} <span style="color:#64748b;">(${c.type})</span></button>`).join('') || '<div style="color:#64748b; font-size:0.72rem; padding:4px;">Sin resultados</div>';
                results.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
                    testCfg.forcedHands[seat].push(parseInt(b.getAttribute('data-pick')));
                    pushTestCfg(); renderTestPanel(_tpLastRoom);
                });
            };
            input.oninput = renderResults;
            renderResults();
            input.focus();
        }

        function updateRoomUI(room) {
            _tpLastRoom = room;
            const p1Name = document.getElementById('room-p1-name');
            const p1Status = document.getElementById('room-p1-status');
            const p2Name = document.getElementById('room-p2-name');
            const p2Status = document.getElementById('room-p2-status');
            const specsList = document.getElementById('room-spectators-list');

            const finished = (room.status === 'finished');
            const winRole = (finished && room.winner) ? room.winner.role : null;
            const fStatus = (pl) => {
                if (pl && !pl.connected && pl.reservadoHasta) {
                    const seg = Math.max(0, Math.ceil((pl.reservadoHasta - Date.now()) / 1000));
                    return { txt: `🪑 Asiento reservado (${seg}s)`, col: '#fbbf24' };
                }
                if (!pl || !pl.connected) return { txt: '⚪ Fuera de la sala', col: '#64748b' };
                if (pl.inIndexHtml) return { txt: '🏆 Viendo resultados', col: '#22c55e' };
                return { txt: '🟡 En la sala', col: '#f59e0b' };
            };

            // Expulsar: el anfitrión de la sala (el líder) y cualquier administrador. El servidor
            // lo vuelve a comprobar por su cuenta -mira la sesión, no lo que diga el cliente-, así
            // que esto de aquí es solo la parte visible.
            const puedoExpulsar = (localStorage.getItem('karlos_is_admin') === '1') || (myRole && room.leader === myRole);
            const botonExpulsar = (quien, nombre) => {
                if (!puedoExpulsar || quien === myRole) return '';
                const n = String(nombre || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
                return `<button class="kick-btn" title="Expulsar a ${n}" data-kick="${String(quien).replace(/"/g, '&quot;')}" data-kick-nombre="${n}">✖</button>`;
            };
            const renderSeat = (pl, nameEl, statusEl, seat) => {
                const kickEl = document.getElementById('room-' + seat + '-kick');
                if (kickEl) kickEl.innerHTML = pl ? botonExpulsar(seat, pl.name) : '';
                if (!pl) {
                    nameEl.innerText = "Asiento libre";
                    const outOfGame = (room.status === 'waiting' || room.status === 'finished');
                    const amSeated = (myRole === 'p1' || myRole === 'p2');
                    if (outOfGame && (myRole === 'spectator' || amSeated)) {
                        statusEl.innerHTML = `<button onclick="occupySeat('${seat}')" style="background:#10b981; color:#fff; border:none; border-radius:6px; padding:3px 10px; font-size:0.8rem; cursor:pointer;">🪑 Sentarse aquí</button>`;
                    } else {
                        statusEl.innerText = "🪑 Libre";
                        statusEl.style.color = "#64748b";
                    }
                    return;
                }
                const crown = (winRole === seat) ? ' 👑' : ((!finished && room.leader === seat) ? ' 👑' : '');
                nameEl.innerText = pl.name + crown;
                nameEl.title = pl.name;   // el nombre se recorta a 130px con puntos suspensivos; entero, al pasar el ratón
                // El asiento reservado manda SIEMPRE, no solo en salas terminadas: es justo el caso
                // en el que un asiento vacío se anunciaba como si su dueño siguiera ahí eligiendo
                // mazo. Fuera de partida es lo único que explica por qué la sala parece ocupada.
                if (!pl.connected) { const s = fStatus(pl); statusEl.innerText = s.txt; statusEl.style.color = s.col; }
                else if (finished) { const s = fStatus(pl); statusEl.innerText = s.txt; statusEl.style.color = s.col; }
                else if (pl.inIndexHtml) { statusEl.innerText = '👁️ Viendo resultados'; statusEl.style.color = '#fbbf24'; }
                else { statusEl.innerText = pl.ready ? '✅ LISTO' : '⏳ Eligiendo mazo'; statusEl.style.color = pl.ready ? '#10b981' : '#94a3b8'; }
            };
            renderSeat(room.players.p1, p1Name, p1Status, 'p1');
            renderSeat(room.players.p2, p2Name, p2Status, 'p2');

            if (room.spectators && room.spectators.length > 0) {
                // Un tercio de ancho por celda: tres columnas "invisibles". Y `title` con el
                // nombre entero, porque a partir de cierto largo se recorta con puntos suspensivos
                // (igual que ya hacían los nombres de J1 y J2).
                specsList.innerHTML = room.spectators.map(s => {
                    const n = String(s.name == null ? '' : s.name);
                    const esc = n.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                    // La celda reserva su hueco de expulsar SIEMPRE, tenga botón o no: así las tres
                    // columnas quedan alineadas entre sí y con la vista de quien no es anfitrión.
                    return `<span class="fila-kick" style="width:33.333%; flex:none; box-sizing:border-box; padding-right:8px;`
                        + ` line-height:1.45; display:inline-flex; align-items:center; gap:4px;">`
                        + `<span title="${esc}" style="flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc}</span>`
                        + `<span class="kick-slot">${botonExpulsar(s.id, n)}</span></span>`;
                }).join('');
            } else {
                specsList.innerHTML = "Ninguno";
            }

            document.querySelectorAll('[data-kick]').forEach(b => {
                b.onclick = (ev) => {
                    ev.stopPropagation();
                    const quien = b.getAttribute('data-kick');
                    const nombre = b.getAttribute('data-kick-nombre') || 'a esa persona';
                    if (!confirm(`¿Expulsar a ${nombre} de la sala?`)) return;
                    socket.emit('kickFromRoom', { roomCode: currentRoom, quien });
                };
            });

            const btnToSpec = document.getElementById('btn-to-spectators');
            if (btnToSpec) {
                const otherSeat = myRole === 'p1' ? 'p2' : (myRole === 'p2' ? 'p1' : null);
                const otherOccupied = otherSeat && !!room.players[otherSeat];
                btnToSpec.style.display = ((myRole === 'p1' || myRole === 'p2') && room.status !== 'playing' && otherOccupied) ? 'inline-block' : 'none';
            }

            const gc = document.getElementById('grace-control');
            if (gc) {
                const sec = Math.round((room.graceMs || 60000) / 1000);
                const isLeader = (myRole === room.leader);
                if (isLeader) {
                    let inp = document.getElementById('grace-input');
                    if (!inp) {
                        gc.innerHTML = `<span style="color:#94a3b8; font-size:0.8rem;">⏱️ Gracia:</span><input type="number" id="grace-input" class="btn-cabecera-sala" min="10" max="600" style="width:52px; margin:0 2px; text-align:center; font-size:0.85rem; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:4px;" onchange="setRoomGrace(this.value)"><span style="color:#94a3b8; font-size:0.8rem;">s</span>`;
                        inp = document.getElementById('grace-input');
                    }
                    if (inp && document.activeElement !== inp) inp.value = sec;
                } else {
                    gc.innerHTML = `<span style="color:#94a3b8; font-size:0.8rem;">⏱️ Gracia: ${sec}s</span>`;
                }
                gc.style.display = 'flex';
            }

            // Normalización del botón de listo: al entrar/volver a una sala en espera, el botón
            // vuelve a su estado base (evita quedarse pillado tras una revancha o cambio de sala).
            if (room.status === 'waiting') {
                const br = document.getElementById('btn-ready');
                const sel = document.getElementById('online-deck-select');
                const meServer = (myRole === 'p1' || myRole === 'p2') ? room.players[myRole] : null;
                const readyServer = !!(meServer && meServer.ready);
                if (br) {
                    br.style.display = 'inline-block';
                    if (!readyServer && isReadyLocal) { isReadyLocal = false; }
                    if (!isReadyLocal) { br.innerText = '¡ESTOY LISTO!'; br.style.background = '#f59e0b'; br.style.color = 'black'; if (sel) sel.disabled = false; }
                }
            }

            const rmArea = document.getElementById('rematch-area');
            if (rmArea) rmArea.innerHTML = ''; // (rework) sin estado de revancha

            // Mientras haya un asiento esperando, se repinta cada segundo para que la cuenta atrás
            // avance de verdad; en cuanto no queda ninguno, se apaga sola.
            const _hayReserva = ['p1', 'p2'].some(st => room.players[st] && !room.players[st].connected && room.players[st].reservadoHasta);
            // Toca SOLO los dos textos de estado, no repinta la sala: `updateRoomUI` recrea el panel
            // de pruebas entero, y hacerlo cada segundo borraría lo que estés escribiendo en el
            // cuadro del escenario.
            if (_hayReserva && !_tickReserva) _tickReserva = setInterval(() => {
                const r = _tpLastRoom;
                if (!r) return;
                let queda = false;
                for (const st of ['p1', 'p2']) {
                    const pl = r.players[st];
                    const el = document.getElementById('room-' + st + '-status');
                    if (!pl || !el || pl.connected || !pl.reservadoHasta) continue;
                    const seg = Math.max(0, Math.ceil((pl.reservadoHasta - Date.now()) / 1000));
                    el.innerText = `🪑 Asiento reservado (${seg}s)`;
                    el.style.color = '#fbbf24';
                    if (seg > 0) queda = true;
                }
                if (!queda) { clearInterval(_tickReserva); _tickReserva = null; }
            }, 1000);
            if (!_hayReserva && _tickReserva) { clearInterval(_tickReserva); _tickReserva = null; }

            pintarCandado(room);
            renderTestPanel(room);
        }

        function sendGlobalChat() {
            const input = document.getElementById('global-chat-input');
            if (input.value.trim()) { socket.emit('globalChat', { username: myUsername, msg: input.value.trim() }); input.value = ''; }
        }

        function sendRoomChat() {
            const input = document.getElementById('room-chat-input');
            if (input.value.trim()) { socket.emit('roomChat', { roomCode: currentRoom, username: myUsername, msg: input.value.trim() }); input.value = ''; }
        }

        function adminCloseRoom(code) {
            if (confirm(`[ADMIN] ¿Estás seguro de que quieres destruir la sala ${code} y expulsar a todos?`)) {
                socket.emit('adminCloseRoom', code);
            }
        }


        // === FUNCIONES DE SALA (restauradas; sus definiciones se perdieron en una edición anterior) ===
        function occupySeat(seat) {
            socket.emit('occupySeat', { roomCode: currentRoom, username: myUsername, seat: seat });
        }
        function becomeSpectator() {
            socket.emit('becomeSpectator', { roomCode: currentRoom, username: myUsername });
        }
        function setRoomGrace(v) {
            socket.emit('setRoomGrace', { roomCode: currentRoom, seconds: parseInt(v) });
        }
        function leaveRoomView() {
            if (currentRoom) socket.emit('abandonGame', { roomCode: currentRoom, username: myUsername, role: myRole });
            currentRoom = null; myRole = null;
            localStorage.removeItem('karlos_room_code');
            localStorage.removeItem('karlos_online_role');
            document.getElementById('online-room-view').style.display = 'none';
            document.getElementById('online-lobby-view').style.display = '';
        }

        function createOnlineRoom() { 
            // Capturamos si las casillas están marcadas
            const allowSpec = document.getElementById('allow-spec-check').checked;
            const isOmni = document.getElementById('omni-check').checked;

            const pass = document.getElementById('pass-check').checked
                ? (document.getElementById('pass-crear').value || '').trim() : '';
            if (document.getElementById('pass-check').checked && !pass) {
                return alert('Has marcado Contraseña pero la has dejado vacía.');
            }
            // Lo enviamos todo al servidor
            socket.emit('createRoom', {
