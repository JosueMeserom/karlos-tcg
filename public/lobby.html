                username: myUsername, 
                allowSpectators: allowSpec, 
                omniscient: isOmni,
                password: pass
            }); 
        }
        // "Omnisciente" no se entiende si no lo sabes ya, y encima seguía tocándose con los
        // espectadores desactivados, que es una opción sobre gente que no va a entrar. Ahora se
        // lee como continuación de la casilla anterior, y se apaga con ella.
        function toggleEspectadores() {
            const on = document.getElementById('allow-spec-check').checked;
            const omni = document.getElementById('omni-check');
            const lbl = document.getElementById('lbl-omni');
            omni.disabled = !on;
            lbl.style.opacity = on ? '1' : '0.4';
            lbl.style.cursor = on ? 'pointer' : 'default';
            lbl.title = on ? 'Quien mire verá también las manos de los dos jugadores'
                           : 'No hay espectadores a los que enseñarles nada';
        }

        function togglePassCrear() {
            const on = document.getElementById('pass-check').checked;
            document.getElementById('pass-crear-fila').style.display = on ? 'flex' : 'none';
            if (on) document.getElementById('pass-crear').focus();
            else document.getElementById('pass-crear').value = '';
        }
        function verPassCrear() {
            const c = document.getElementById('pass-crear-ver').checked;
            document.getElementById('pass-crear').classList.toggle('visible', c);
        }

        // ── ENLACE DIRECTO A LA SALA ──────────────────────────────────────────────────────
        // `lobby.html?sala=A4X9` entra solo en esa sala. Solo si el guardián NO ha visto una
        // partida en curso: si la hay, manda él, que para eso está (te preguntará si reconectar o
        // abandonar antes de dejarte ir a ningún lado).
        function salaDeLaURL() {
            try {
                const c = (new URLSearchParams(location.search).get('sala') || '').trim().toUpperCase();
                return /^[A-Z0-9]{4}$/.test(c) ? c : null;
            } catch (e) { return null; }
        }
        function enlaceDeSala(code) {
            return location.origin + location.pathname + '?mode=online&sala=' + encodeURIComponent(code);
        }
        // ── EL CANDADO DE LA SALA ─────────────────────────────────────────────────────────
        // Un solo botón en la cabecera en vez de un cuarto elemento con su campo: dice el estado
        // de un vistazo (🔒/🔓) y al clicarlo abre lo justo para cambiarlo. Solo el anfitrión y
        // los administradores pueden abrirlo; los demás ven el estado y ya.
        function pintarCandado(room) {
            const b = document.getElementById('btn-candado-sala');
            if (!b) return;
            const puedo = (localStorage.getItem('karlos_is_admin') === '1') || (myRole && room && room.leader === myRole);
            const con = !!(room && room.tienePassword);
            b.style.display = 'inline-flex';
            b.textContent = con ? '🔒' : '🔓';
            b.title = con
                ? (puedo ? 'La sala tiene contraseña - clic para cambiarla o quitarla' : 'La sala tiene contraseña')
                : (puedo ? 'Sin contraseña - clic para ponerle una' : 'Sala sin contraseña');
            b.style.cursor = puedo ? 'pointer' : 'default';
            b.style.background = con ? '#3f2d1a' : '#334155';
            b.dataset.puedo = puedo ? '1' : '';
        }
        function abrirCandado(ev) {
            const b = document.getElementById('btn-candado-sala');
            if (!b || !b.dataset.puedo) return;
            if (ev) ev.stopPropagation();
            const con = b.textContent === '🔒';
            const p = prompt(con
                ? 'Contraseña de la sala (déjala vacía para quitarla):'
                : 'Contraseña para esta sala (vacía = sin contraseña):', '');
            if (p === null) return;
            socket.emit('setRoomPassword', { roomCode: currentRoom, password: p.trim() });
            avisillo(p.trim() ? '🔒 Contraseña puesta' : '🔓 Contraseña quitada', b);
        }

        function copiarEnlaceSala() {
            const btn = document.getElementById('btn-copiar-sala');
            if (!currentRoom) { avisillo('Todavía no estás en una sala', btn); return; }
            const url = enlaceDeSala(currentRoom);
            const ok = () => avisillo('¡Enlace copiado!', btn);
            // writeText necesita contexto seguro (HTTPS), y esto se sirve por HTTP en la red de
            // casa, así que el camino normal es el de abajo: un input de usar y tirar con
            // execCommand, que sigue funcionando sin HTTPS.
            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(ok).catch(() => copiarAPelo(url, btn));
                return;
            }
            copiarAPelo(url, btn);
        }
        function copiarAPelo(texto, btn) {
            try {
                const t = document.createElement('textarea');
                t.value = texto;
                t.setAttribute('readonly', '');
                t.style.cssText = 'position:fixed; top:-1000px; opacity:0;';
                document.body.appendChild(t);
                t.select(); t.setSelectionRange(0, texto.length);
                const bien = document.execCommand('copy');
                t.remove();
                avisillo(bien ? '¡Enlace copiado!' : 'No he podido copiarlo', btn);
            } catch (e) {
                avisillo('No he podido copiarlo', btn);
                prompt('Copia el enlace a mano:', texto);
            }
        }

        function joinRoomByCode(code, asSpectator = false, password) {
            code = code || document.getElementById('room-code-input').value.trim().toUpperCase();
            if (code.length !== 4) return alert("El código debe tener 4 caracteres.");
            
            localStorage.setItem('karlos_username', myUsername); // <--- Evita el null
            // Se recuerda el último intento para poder repetirlo si el servidor pide contraseña.
            _ultimoIntento = { code, asSpectator };
            socket.emit('joinRoom', { code, username: myUsername, asSpectator, password });
        }
        let _ultimoIntento = null;

        function toggleReady() {
            try {
                isReadyLocal = !isReadyLocal;
                const btn = document.getElementById('btn-ready');
                const select = document.getElementById('online-deck-select');
                
                if (isReadyLocal) {
                    btn.innerText = "CANCELAR LISTO";
                    btn.style.background = "#ef4444"; btn.style.color = "white";
                    select.disabled = true;
                } else {
                    btn.innerText = "¡ESTOY LISTO!";
                    btn.style.background = "#f59e0b"; btn.style.color = "black";
                    select.disabled = false;
                }
                
                let deckCards = null;
                if (select.value !== 'random') {
                    const deck = userDecks.find(d => d.id == select.value);
                    if (deck) deckCards = deck.cards;
                }

                if (!deckCards) {
                    const personajes = CARD_DB.filter(c => c.type === 'Personaje' && esColeccionable(c)).map(c => c.id);
                    const otros = CARD_DB.filter(c => c.type !== 'Personaje' && esColeccionable(c)).map(c => c.id);
                    
                    for(let i = personajes.length - 1; i > 0; i--) { 
                        const j = Math.floor(Math.random()*(i+1)); 
                        [personajes[i], personajes[j]] = [personajes[j], personajes[i]]; 
                    }
                    
                    const numPersonajes = Math.min(personajes.length, Math.floor(Math.random()*4)+4);
                    deckCards = personajes.slice(0, numPersonajes);
                    
                    while(deckCards.length < 40) {
                        deckCards.push(otros[Math.floor(Math.random()*otros.length)]);
                    }
                }
                
                socket.emit('playerReady', { roomCode: currentRoom, isReady: isReadyLocal, deck: deckCards });
            } catch (e) {
                console.error("Error al dar listo:", e);
                alert("Error al preparar el mazo. Por favor, recarga la página.");
            }
        }

        const getDeckCards = (val) => {
            if (val === 'random') return 'random';
            const deck = userDecks.find(d => d.id == val);
            return deck ? JSON.stringify(deck.cards) : 'random';
        };

        function startLocalMatch() {
            localStorage.setItem('karlos_game_mode', 'local');
            localStorage.setItem('karlos_game_mode', 'local');
            localStorage.setItem('karlos_p1_name', 'Jugador 1');
            localStorage.setItem('karlos_p2_name', 'Jugador 2');
            localStorage.setItem('karlos_p1_deck', getDeckCards(document.getElementById('p1-deck-select').value));
            localStorage.setItem('karlos_p2_deck', getDeckCards(document.getElementById('p2-deck-select').value));
            localStorage.setItem('karlos_fast_start', document.getElementById('fast-start-check').checked);
            localStorage.setItem('karlos_force_start', document.getElementById('force-start-select').value);
            window.location.href = 'index.html';
        }

        function startAIMatch() {
            localStorage.setItem('karlos_game_mode', 'ai');
            localStorage.setItem('karlos_p1_name', myUsername || 'Jugador');
            
            const botType = document.getElementById('ai-bot-select').value;
            localStorage.setItem('karlos_ai_type', botType); 
            
            if (botType === 'random') {
                localStorage.setItem('karlos_p2_name', 'Bot aleatorio');
                localStorage.setItem('karlos_p2_deck', 'random');
            }
            
            localStorage.setItem('karlos_p1_deck', getDeckCards(document.getElementById('ai-p1-deck-select').value));
            localStorage.setItem('karlos_fast_start', document.getElementById('ai-fast-start-check').checked);
            localStorage.setItem('karlos_force_start', document.getElementById('ai-force-start-select').value);
            window.location.href = 'index.html';
        }

        init();
        inicializarReglas();
    </script>
